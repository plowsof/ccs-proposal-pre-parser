# The GitLab job's proposal checks (gitlab_workflow.yml), on Forgejo, without PHP: pre_parser.sh,
# both stages in bash, the YAML read by ccs-bash's own parser. Goes in ccs-proposals as
# .forgejo/workflows/pre-parser.yml.
#
# pull_request_target: this file and both scripts come from master, never from the pull request,
# whose proposal is only read (git show). The runner runs jobs on its host.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

jobs:
  pre_parser:
    runs-on: docker
    steps:
      - name: Check the proposal
        env:
          TOKEN: ${{ github.token }}
          # the comment comes from n1oc: a disroot account whose token (write:issue only) is the
          # N1OC_TOKEN secret; without it, from Forgejo's own bot
          N1OC_TOKEN: ${{ secrets.N1OC_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          RUN: ${{ github.run_number }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          cd "$work"
          # pinned, as gitlab_workflow.yml pins its two, and checked
          curl -fsSL -o pre_parser.sh https://raw.githubusercontent.com/plowsof/ccs-proposal-pre-parser/e1060d6993b4e57234d82f60afb400e7fb6aefac/pre_parser.sh
          curl -fsSL -o frontmatter.awk https://raw.githubusercontent.com/plowsof/ccs-bash/6fbc5fbd7b59e897caad8a2e9cef2a034cb851d2/lib/frontmatter.awk
          sha256sum -c <<'SUMS'
          10a529f21dddf0d98d16aab6a1996f0026631058d0ce73028ad6ad07952d132f  pre_parser.sh
          c19fff18ce6f5ec18ee9e8a18afbda8beb943e9724fccda02f823ddfa5bf224b  frontmatter.awk
          SUMS
          jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH" > description.md
          git init -q repo
          cd repo
          # the job's own token, read-only: also a private repository can be fetched
          git -c http.extraHeader="Authorization: token $TOKEN" fetch -q "$SERVER/$REPO" "+refs/heads/master:refs/base" "+refs/pull/$PR/head:refs/pr"
          rc=0
          BASE=refs/base HEAD=refs/pr DESCRIPTION=../description.md FRONTMATTER_AWK=../frontmatter.awk bash ../pre_parser.sh \
              2>&1 | tee ../out.txt || rc=$?
          # The result as one comment on the pull request, edited on each run (Forgejo shows no
          # annotations). The proposal's text can be in it: inside a code block, without backticks,
          # so it can't add links or mention anyone.
          result=$(sed 's/\x1b\[[0-9;]*m//g' ../out.txt | grep -E '^(Error|Warning): ' | tr -d '`' || true)
          if ((rc)); then head="❌ The proposal check failed"; else head="✅ The proposal check passed"; fi
          body=$(printf '<!-- pre-parser -->\n%s.\n\n```\n%s\n```\n\n[The check'"'"'s log](%s/%s/actions/runs/%s)\n' \
              "$head" "${result:-No problems.}" "$SERVER" "$REPO" "$RUN" | jq -Rs '{body: .}')
          api="$SERVER/api/v1/repos/$REPO"
          auth="Authorization: token ${N1OC_TOKEN:-$TOKEN}"
          id=$(curl -fsS -H "$auth" "$api/issues/$PR/comments" | jq -r '[.[] | select(.body | startswith("<!-- pre-parser -->"))][0].id // empty') || id=
          if [[ -n $id ]]; then
              curl -fsS -o /dev/null -X PATCH -H "$auth" -H 'Content-Type: application/json' -d "$body" "$api/issues/comments/$id" || echo "(could not update the comment)"
          else
              curl -fsS -o /dev/null -X POST -H "$auth" -H 'Content-Type: application/json' -d "$body" "$api/issues/$PR/comments" || echo "(could not comment)"
          fi
          exit "$rc"
