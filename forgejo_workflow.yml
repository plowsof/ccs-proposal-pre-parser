# The GitLab job's proposal checks (gitlab_workflow.yml), on Forgejo, without PHP: pre_parser.sh,
# both stages in bash, the YAML read by ccs-bash's own parser. Goes in ccs-proposals as
# .forgejo/workflows/pre-parser.yml.
#
# pull_request_target: this file and both scripts come from master, never from the pull request,
# whose proposal is only read (git show). The runner runs jobs on its host.
#
# Once merged, the same comment becomes a link to the proposal on master (and to edit it there):
# the file the maintainers later change (milestones, payouts) keeps its name, so the link always
# opens its newest version.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, closed]

jobs:
  pre_parser:
    runs-on: docker
    steps:
      - name: Check the proposal
        env:
          TOKEN: ${{ github.token }}
          # the comment comes from n1oc: a disroot account whose token (write:issue only) is the
          # N1OC_TOKEN secret; without it, from Forgejo's own bot
          N1OC_TOKEN: ${{ secrets.N1OC_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          RUN: ${{ github.run_number }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          api="$SERVER/api/v1/repos/$REPO"
          auth="Authorization: token ${N1OC_TOKEN:-$TOKEN}"
          # comment BODY: the one comment on the pull request, edited in place
          comment() {
              local body id
              body=$(printf '<!-- pre-parser -->\n%s' "$1" | jq -Rs '{body: .}')
              id=$(curl -fsS -H "$auth" "$api/issues/$PR/comments" | jq -r '[.[] | select(.body | startswith("<!-- pre-parser -->"))][0].id // empty') || id=
              if [[ -n $id ]]; then
                  curl -fsS -o /dev/null -X PATCH -H "$auth" -H 'Content-Type: application/json' -d "$body" "$api/issues/comments/$id" || echo "(could not update the comment)"
              else
                  curl -fsS -o /dev/null -X POST -H "$auth" -H 'Content-Type: application/json' -d "$body" "$api/issues/$PR/comments" || echo "(could not comment)"
              fi
          }
          # closed: if merged, the proposal on master; not merged, nothing
          if [[ $(jq -r '.action' "$GITHUB_EVENT_PATH") == closed ]]; then
              [[ $(jq -r '.pull_request.merged' "$GITHUB_EVENT_PATH") == true ]] || exit 0
              branch=$(jq -r '.pull_request.base.ref' "$GITHUB_EVENT_PATH")
              file=$(curl -fsS -H "Authorization: token $TOKEN" "$api/pulls/$PR/files" \
                  | jq -r '[.[] | select(.status == "added") | .filename | select(test("^[^/]+\\.md$"))][0] // empty')
              [[ -n $file ]] || exit 0
              path=$(jq -rn --arg f "$file" '$f | @uri')
              comment "$(printf '✅ Merged. The proposal on %s: [%s](%s/%s/src/branch/%s/%s) · [edit it](%s/%s/_edit/%s/%s)\n\nThat link always opens its newest version: later changes (milestones, payouts) are made to this file.\n' \
                  "$branch" "$(tr -d '[]`' <<<"$file")" "$SERVER" "$REPO" "$branch" "$path" "$SERVER" "$REPO" "$branch" "$path")"
              exit 0
          fi
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          cd "$work"
          # pinned, as gitlab_workflow.yml pins its two, and checked
          curl -fsSL -o pre_parser.sh https://raw.githubusercontent.com/plowsof/ccs-proposal-pre-parser/d84cc28b5a6984a07e51fe0523a7452488631816/pre_parser.sh
          curl -fsSL -o frontmatter.awk https://raw.githubusercontent.com/plowsof/ccs-bash/6fbc5fbd7b59e897caad8a2e9cef2a034cb851d2/lib/frontmatter.awk
          sha256sum -c <<'SUMS'
          eed1d5f1ba64968e0e369965de74aae81092cf60753f49fe16d8d08f1a395e80  pre_parser.sh
          c19fff18ce6f5ec18ee9e8a18afbda8beb943e9724fccda02f823ddfa5bf224b  frontmatter.awk
          SUMS
          jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH" > description.md
          git init -q repo
          cd repo
          # the job's own token, read-only: also a private repository can be fetched
          git -c http.extraHeader="Authorization: token $TOKEN" fetch -q "$SERVER/$REPO" "+refs/heads/master:refs/base" "+refs/pull/$PR/head:refs/pr"
          rc=0
          BASE=refs/base HEAD=refs/pr DESCRIPTION=../description.md FRONTMATTER_AWK=../frontmatter.awk DIFF_FILE=../diff.txt bash ../pre_parser.sh \
              2>&1 | tee ../out.txt || rc=$?
          # The result as one comment on the pull request, edited on each run (Forgejo shows no
          # annotations). The proposal's text can be in it: inside a code block, without backticks,
          # so it can't add links or mention anyone.
          result=$(sed 's/\x1b\[[0-9;]*m//g' ../out.txt | grep -E '^(Error|Warning): ' | tr -d '`' || true)
          if ((rc)); then head="❌ The proposal check failed"; else head="✅ The proposal check passed"; fi
          # the description's differences from the file: its lines -, the file's +, at most 40 lines
          diff=""
          if [[ -s ../diff.txt ]]; then
              diff=$(tr -d '`' < ../diff.txt | awk 'NR <= 40; NR == 41 { print "... (more in the log)" }')
              diff=$(printf '\nThe description (-) and the file (+), below the front matter:\n\n```diff\n%s\n```\n' "$diff")
          fi
          comment "$(printf '%s.\n\n```\n%s\n```\n%s\n[The check'"'"'s log](%s/%s/actions/runs/%s)\n' \
              "$head" "${result:-No problems.}" "$diff" "$SERVER" "$REPO" "$RUN")"
          exit "$rc"
